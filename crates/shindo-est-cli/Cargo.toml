[package]
name = "shindo-est-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "shindo-est"
path = "src/main.rs"
# The bin's documentation would go where the core library's goes.
doc = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
shindo-est = { version = "0.1.0", path = "../shindo-est" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
