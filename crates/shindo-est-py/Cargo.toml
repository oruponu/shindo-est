[package]
name = "shindo-est-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shindo_est_py"
crate-type = ["cdylib"]
# The tests are in Python: a Rust test binary would need the Python DLL at
# run time.
test = false
doctest = false

[dependencies]
numpy = "0.30.0"
pyo3 = "0.30.1"
shindo-est = { version = "0.1.0", path = "../shindo-est" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
