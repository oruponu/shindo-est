[package]
name = "shindo-est"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libm = "0.2.16"
sha2 = "0.11.1"

# Miri cannot execute the inline assembly used by libm's x86 sqrt, so tests
# under Miri use libm's portable sqrt. Both are correctly rounded, so they
# produce identical bits for all non-NaN results.
[target.'cfg(miri)'.dependencies]
libm = { version = "0.2.16", features = ["force-soft-floats"] }

[[bench]]
name = "predict"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A fused multiply-add rounds once instead of twice, so it changes results.
# Predictions must match LightGBM and stay identical across platforms and
# languages, so arithmetic is written out as plain multiplications and additions.
suboptimal_flops = "allow"
